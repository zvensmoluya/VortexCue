[versions]
agp = "9.3.1"
kotlin = "2.3.21"
activityCompose = "1.13.0"
composeBom = "2026.06.01"
coroutines = "1.11.0"
datastore = "1.2.1"
media3 = "1.10.1"
work = "2.11.2"
okhttp = "5.3.0"
serialization = "1.11.0"
junit = "4.13.2"
ksp = "2.3.10"
room3 = "3.0.1"
sqlite = "2.7.0"
paging = "3.5.0"
robolectric = "4.16.1"
opencc4j = "1.14.0"

[libraries]
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
datastore-core-jvm = { module = "androidx.datastore:datastore-core-jvm", version.ref = "datastore" }
datastore-core-okio-jvm = { module = "androidx.datastore:datastore-core-okio-jvm", version.ref = "datastore" }
datastore-preferences-core-jvm = { module = "androidx.datastore:datastore-preferences-core-jvm", version.ref = "datastore" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
media3-extractor = { module = "androidx.media3:media3-extractor", version.ref = "media3" }
work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
junit = { module = "junit:junit", version.ref = "junit" }
room3-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room3" }
room3-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room3" }
room3-paging = { module = "androidx.room3:room3-paging", version.ref = "room3" }
room3-testing = { module = "androidx.room3:room3-testing", version.ref = "room3" }
room3-runtime-jvm = { module = "androidx.room3:room3-runtime-jvm", version.ref = "room3" }
room3-paging-jvm = { module = "androidx.room3:room3-paging-jvm", version.ref = "room3" }
room3-testing-jvm = { module = "androidx.room3:room3-testing-jvm", version.ref = "room3" }
sqlite-framework = { module = "androidx.sqlite:sqlite-framework", version.ref = "sqlite" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
sqlite-core-jvm = { module = "androidx.sqlite:sqlite-jvm", version.ref = "sqlite" }
sqlite-async-jvm = { module = "androidx.sqlite:sqlite-async-jvm", version.ref = "sqlite" }
sqlite-bundled-jvm = { module = "androidx.sqlite:sqlite-bundled-jvm", version.ref = "sqlite" }
paging-runtime = { module = "androidx.paging:paging-runtime", version.ref = "paging" }
paging-compose = { module = "androidx.paging:paging-compose", version.ref = "paging" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
opencc4j = { module = "com.github.houbb:opencc4j", version.ref = "opencc4j" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room3 = { id = "androidx.room3", version.ref = "room3" }
