<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1320 900" role="img" aria-labelledby="title desc">
  <title id="title">Yingying curtain ghost expression sheet</title>
  <desc id="desc">Six expressions share a flat yellow curtain-ghost outline on true black with no gradients or glow.</desc>

  <defs>
    <g id="curtain-body">
      <rect width="512" height="512" rx="112" fill="#000000"/>
      <path d="M164 374 C150 327 143 276 149 220 C157 151 196 112 256 112 C316 112 355 151 363 220 C369 276 362 327 348 374 C331 352 315 350 299 377 C284 351 270 349 256 379 C242 349 228 351 213 377 C197 350 181 352 164 374 Z"
            fill="#000000" stroke="#FFD84D" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M193 190 C185 235 188 286 202 336" fill="none" stroke="#FFD84D" stroke-width="6" stroke-linecap="round" opacity="0.42"/>
      <path d="M319 190 C327 235 324 286 310 336" fill="none" stroke="#FFD84D" stroke-width="6" stroke-linecap="round" opacity="0.42"/>
    </g>

    <symbol id="expression-hello" viewBox="0 0 512 512">
      <use href="#curtain-body"/>
      <rect x="210" y="218" width="19" height="29" rx="9.5" fill="#FFF8DF"/>
      <rect x="283" y="218" width="19" height="29" rx="9.5" fill="#FFF8DF"/>
      <path d="M237 275 Q256 291 275 275" fill="none" stroke="#FFF8DF" stroke-width="8" stroke-linecap="round"/>
    </symbol>

    <symbol id="expression-sleepy" viewBox="0 0 512 512">
      <use href="#curtain-body"/>
      <path d="M207 236 H234" fill="none" stroke="#FFF8DF" stroke-width="10" stroke-linecap="round"/>
      <path d="M278 236 H305" fill="none" stroke="#FFF8DF" stroke-width="10" stroke-linecap="round"/>
      <path d="M247 280 H265" fill="none" stroke="#FFF8DF" stroke-width="8" stroke-linecap="round"/>
    </symbol>

    <symbol id="expression-delighted" viewBox="0 0 512 512">
      <use href="#curtain-body"/>
      <path d="M205 241 Q220 221 237 241" fill="none" stroke="#FFF8DF" stroke-width="9" stroke-linecap="round"/>
      <path d="M275 241 Q292 221 307 241" fill="none" stroke="#FFF8DF" stroke-width="9" stroke-linecap="round"/>
      <path d="M233 273 Q256 301 279 273" fill="#FFD84D" stroke="#FFF8DF" stroke-width="8" stroke-linejoin="round"/>
    </symbol>

    <symbol id="expression-surprised" viewBox="0 0 512 512">
      <use href="#curtain-body"/>
      <circle cx="220" cy="232" r="13" fill="#FFF8DF"/>
      <circle cx="292" cy="232" r="13" fill="#FFF8DF"/>
      <circle cx="256" cy="283" r="12" fill="none" stroke="#FFF8DF" stroke-width="8"/>
    </symbol>

    <symbol id="expression-listening" viewBox="0 0 512 512">
      <use href="#curtain-body"/>
      <circle cx="225" cy="235" r="9" fill="#FFF8DF"/>
      <circle cx="297" cy="230" r="9" fill="#FFF8DF"/>
      <path d="M242 279 Q258 273 272 280" fill="none" stroke="#FFF8DF" stroke-width="8" stroke-linecap="round"/>
      <path d="M337 211 Q353 226 337 241" fill="none" stroke="#FFD84D" stroke-width="7" stroke-linecap="round"/>
      <path d="M351 200 Q378 226 351 252" fill="none" stroke="#FFD84D" stroke-width="6" stroke-linecap="round" opacity="0.54"/>
    </symbol>

    <symbol id="expression-wait" viewBox="0 0 512 512">
      <use href="#curtain-body"/>
      <rect x="210" y="218" width="19" height="29" rx="9.5" fill="#FFF8DF"/>
      <path d="M279 235 H306" fill="none" stroke="#FFF8DF" stroke-width="10" stroke-linecap="round"/>
      <path d="M237 282 C246 272 256 291 266 280 C272 274 277 277 281 282" fill="none" stroke="#FFF8DF" stroke-width="8" stroke-linecap="round"/>
    </symbol>
  </defs>

  <rect width="1320" height="900" fill="#101010"/>
  <text x="48" y="65" fill="#F2EDE2" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="32" font-weight="600">荧荧 · 黄色窗帘幽灵表情试作</text>
  <text x="1272" y="65" fill="#8A8269" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="17" text-anchor="end">true black · flat outline · zero glow</text>

  <g transform="translate(48 104)">
    <rect width="392" height="350" rx="28" fill="#181818" stroke="#2A2A2A" stroke-width="2"/>
    <use href="#expression-hello" x="80" y="22" width="232" height="232"/>
    <text x="32" y="302" fill="#F2EDE2" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="24" font-weight="600">你好</text>
    <text x="32" y="331" fill="#77736B" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="15">默认 / attentive</text>
  </g>

  <g transform="translate(464 104)">
    <rect width="392" height="350" rx="28" fill="#181818" stroke="#2A2A2A" stroke-width="2"/>
    <use href="#expression-sleepy" x="80" y="22" width="232" height="232"/>
    <text x="32" y="302" fill="#F2EDE2" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="24" font-weight="600">困困</text>
    <text x="32" y="331" fill="#77736B" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="15">暂停 / sleepy</text>
  </g>

  <g transform="translate(880 104)">
    <rect width="392" height="350" rx="28" fill="#181818" stroke="#2A2A2A" stroke-width="2"/>
    <use href="#expression-delighted" x="80" y="22" width="232" height="232"/>
    <text x="32" y="302" fill="#F2EDE2" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="24" font-weight="600">好耶</text>
    <text x="32" y="331" fill="#77736B" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="15">完成 / delighted</text>
  </g>

  <g transform="translate(48 490)">
    <rect width="392" height="350" rx="28" fill="#181818" stroke="#2A2A2A" stroke-width="2"/>
    <use href="#expression-surprised" x="80" y="22" width="232" height="232"/>
    <text x="32" y="302" fill="#F2EDE2" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="24" font-weight="600">诶？</text>
    <text x="32" y="331" fill="#77736B" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="15">异常 / surprised</text>
  </g>

  <g transform="translate(464 490)">
    <rect width="392" height="350" rx="28" fill="#181818" stroke="#2A2A2A" stroke-width="2"/>
    <use href="#expression-listening" x="80" y="22" width="232" height="232"/>
    <text x="32" y="302" fill="#F2EDE2" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="24" font-weight="600">在听</text>
    <text x="32" y="331" fill="#77736B" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="15">播放 / listening</text>
  </g>

  <g transform="translate(880 490)">
    <rect width="392" height="350" rx="28" fill="#181818" stroke="#2A2A2A" stroke-width="2"/>
    <use href="#expression-wait" x="80" y="22" width="232" height="232"/>
    <text x="32" y="302" fill="#F2EDE2" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="24" font-weight="600">等等</text>
    <text x="32" y="331" fill="#77736B" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" font-size="15">加载 / waiting</text>
  </g>
</svg>
